name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Parity tests against the upstream RaTeX Rust binaries skip
      # cleanly when RATEX_LEX / RATEX_TARGET_DIR are unset, so the rest
      # of the suite still runs in CI.
      - name: Test
        run: go test ./...
